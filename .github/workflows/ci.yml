name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check JavaScript, types and documentation
        run: |
          npm test
          npm run test:types
          npm run check:docs
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Install WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Build and inspect component package
        run: |
          npm run build
          npm run check:package
          npm run pack:editor
