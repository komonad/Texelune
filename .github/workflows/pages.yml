name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v6.0.0
      - run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install WASM bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.108 --locked
      - name: Build static demo
        run: |
          npm run build
          npm run check:package
          npm run build:pages
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
