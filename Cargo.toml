[package]
name = "texelune-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust WebGPU text editor with worker-based incremental layout"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ropey = "1.6"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
unicode-bidi = "0.3.18"
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
futures-channel = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance", "console"] }
wgpu = { version = "27", default-features = false, features = ["std", "webgpu", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1
